volumes:
  chess_analyzer_data:

services:
  chess-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chess-analyzer
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - STOCKFISH_PATH=/usr/games/stockfish
      - CHESS_MODEL_PATH=/app/models/best_chess_policy_model.pt
      - DB_PATH=/app/data/chess_analyzer.db
      - PORT=8000
    volumes:
      - chess_analyzer_data:/app/data
      - ./training/models:/app/models:ro
    restart: unless-stopped

