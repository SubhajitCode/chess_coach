services:
  - type: web
    name: chess-analyzer
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: STOCKFISH_PATH
        value: /usr/games/stockfish
      - key: CHESS_MODEL_PATH
        value: /app/models/best_chess_policy_model.pt
      - key: DB_PATH
        value: /app/data/chess_analyzer.db
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
